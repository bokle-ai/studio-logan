<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Studio Logan — Architecture &amp; Interiors</title>
<meta name="description" content="Studio Logan — Architecture &amp; Interiors. Crafting spaces where heritage converges with vision.">
<link rel="icon" href="assets/img/lion-double.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tenor+Sans&family=Poppins:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:    #f7f5f2;
  --ink:   #1a1712;
  --mid:   #8a7f72;
  --gold:  #b09a7a;
  --f-display: "Tenor Sans", sans-serif;
  --f-sans:    "Poppins", system-ui, sans-serif;
}

html, body {
  height: 100%;
  overflow: hidden;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--f-sans);
  -webkit-font-smoothing: antialiased;
}

/* ── TOP LOGO ── */
.site-logo {
  position: fixed;
  top: 2rem;
  left: 2.5rem;
  z-index: 50;
  display: flex;
  align-items: center;
  gap: .6rem;
  text-decoration: none;
  color: var(--ink);
}
.site-logo__mark {
  width: 32px;
  height: 32px;
  object-fit: contain;
}
.site-logo__name {
  font-family: var(--f-display);
  font-size: .85rem;
  letter-spacing: .12em;
  text-transform: uppercase;
}

/* ── HERO SPLIT ── */
.hero {
  display: grid;
  grid-template-columns: 1fr 1fr;
  height: calc(100vh - 72px); /* leave room for bottom nav */
}

/* LEFT PANEL */
.hero__left {
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  padding: 2.5rem 3rem 3rem;
  background: var(--bg);
  position: relative;
}

.hero__eyebrow {
  font-family: var(--f-sans);
  font-size: .7rem;
  font-weight: 500;
  letter-spacing: .18em;
  text-transform: uppercase;
  color: var(--gold);
  margin-bottom: 1.2rem;
}

.hero__title {
  font-family: var(--f-display);
  font-size: clamp(3.5rem, 6vw, 6rem);
  line-height: 1;
  letter-spacing: -.01em;
  color: var(--ink);
  margin-bottom: 1.4rem;
}

.hero__desc {
  font-size: .9rem;
  font-weight: 300;
  line-height: 1.75;
  color: var(--mid);
  max-width: 30ch;
  margin-bottom: 2.5rem;
}

.hero__cta {
  display: inline-flex;
  align-items: center;
  gap: .6rem;
  font-size: .78rem;
  font-weight: 500;
  letter-spacing: .12em;
  text-transform: uppercase;
  text-decoration: none;
  color: var(--ink);
  border-bottom: 1px solid var(--ink);
  padding-bottom: .2rem;
  transition: color .3s, border-color .3s;
}
.hero__cta:hover { color: var(--gold); border-color: var(--gold); }

/* RIGHT PANEL */
.hero__right {
  position: relative;
  overflow: hidden;
  background: #111;
}

.hero__img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  opacity: 0;
  transition: opacity .9s ease;
}
.hero__img.is-active { opacity: 1; }

.hero__img-label {
  position: absolute;
  bottom: 1.8rem;
  left: 2rem;
  font-family: var(--f-sans);
  font-size: .7rem;
  font-weight: 400;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: rgba(255,255,255,.75);
  z-index: 5;
  pointer-events: none;
  transition: opacity .4s;
}

/* ── BOTTOM NAV ── */
.bottom-nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  height: 72px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 2.5rem;
  background: var(--bg);
  border-top: 1px solid rgba(0,0,0,.08);
  z-index: 50;
}

.bottom-nav__links {
  display: flex;
  align-items: center;
  gap: 2.5rem;
}
.bottom-nav__links a {
  font-size: .72rem;
  font-weight: 500;
  letter-spacing: .14em;
  text-transform: uppercase;
  text-decoration: none;
  color: var(--mid);
  transition: color .25s;
}
.bottom-nav__links a:hover { color: var(--ink); }

.bottom-nav__projects {
  display: flex;
  align-items: center;
  gap: 0;
}

.proj-btn {
  background: none;
  border: none;
  cursor: pointer;
  font-family: var(--f-sans);
  font-size: .72rem;
  font-weight: 400;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--mid);
  padding: .4rem 1.4rem;
  border-right: 1px solid rgba(0,0,0,.08);
  transition: color .25s;
  white-space: nowrap;
}
.proj-btn:first-child { border-left: 1px solid rgba(0,0,0,.08); }
.proj-btn:hover { color: var(--ink); }
.proj-btn.is-active { color: var(--ink); font-weight: 500; }

.bottom-nav__contact a {
  font-size: .72rem;
  font-weight: 500;
  letter-spacing: .14em;
  text-transform: uppercase;
  text-decoration: none;
  color: var(--ink);
  background: var(--ink);
  color: var(--bg);
  padding: .55rem 1.4rem;
  transition: background .25s;
}
.bottom-nav__contact a:hover { background: var(--gold); }

/* ── MOBILE ── */
@media (max-width: 768px) {
  html, body { overflow: auto; }

  .hero {
    grid-template-columns: 1fr;
    grid-template-rows: 50vh auto;
    height: auto;
  }

  .hero__right { order: -1; height: 50vh; }

  .hero__left {
    padding: 2rem 1.5rem;
    justify-content: flex-start;
  }

  .hero__title { font-size: 2.8rem; }

  .bottom-nav {
    position: relative;
    height: auto;
    flex-direction: column;
    gap: 1rem;
    padding: 1.5rem;
    align-items: flex-start;
  }

  .bottom-nav__projects { flex-wrap: wrap; gap: .5rem; }

  .proj-btn { border: 1px solid rgba(0,0,0,.1); padding: .35rem 1rem; }
  .proj-btn:first-child { border: 1px solid rgba(0,0,0,.1); }
}
</style>
</head>
<body>

<!-- Logo -->
<a href="index.html" class="site-logo">
  <img src="assets/img/lion-double.png" alt="Studio Logan" class="site-logo__mark">
  <span class="site-logo__name">Studio Logan</span>
</a>

<!-- Hero -->
<main class="hero">

  <!-- Left: text -->
  <div class="hero__left">
    <span class="hero__eyebrow">Architecture + Interiors</span>
    <h1 class="hero__title">Where Vision<br>Meets Space</h1>
    <p class="hero__desc">A cosmopolitan design studio crafting hospitality and residential environments where heritage converges with vision.</p>
    <a href="#" class="hero__cta" onclick="document.querySelector('#contact-section').scrollIntoView()">Start a project &nbsp;→</a>
  </div>

  <!-- Right: images -->
  <div class="hero__right">
    <img class="hero__img is-active" src="assets/img/canter-hero.jpg"         alt="Canter Hotel">
    <img class="hero__img"           src="assets/img/hardrock-ext.jpg"         alt="Hard Rock Athens">
    <img class="hero__img"           src="assets/img/manhattan-living.jpg"     alt="432 Park Avenue">
    <img class="hero__img"           src="assets/img/piertop-exterior.jpg"     alt="Pier Top">
    <span class="hero__img-label" id="imgLabel">Canter Hotel &nbsp;·&nbsp; Oklahoma City</span>
  </div>

</main>

<!-- Bottom Navigation -->
<nav class="bottom-nav">

  <div class="bottom-nav__links">
    <a href="studio.html">About</a>
    <a href="projects.html">Projects</a>
    <a href="services.html">Services</a>
  </div>

  <div class="bottom-nav__projects">
    <button class="proj-btn is-active" data-idx="0" data-label="Canter Hotel &nbsp;·&nbsp; Oklahoma City">Canter Hotel</button>
    <button class="proj-btn"           data-idx="1" data-label="Hard Rock Athens &nbsp;·&nbsp; Greece">Hard Rock</button>
    <button class="proj-btn"           data-idx="2" data-label="432 Park Avenue &nbsp;·&nbsp; Manhattan">432 Park</button>
    <button class="proj-btn"           data-idx="3" data-label="Pier Top &nbsp;·&nbsp; Fort Lauderdale">Pier Top</button>
  </div>

  <div class="bottom-nav__contact">
    <a href="mailto:studio@studiologan.com">Contact</a>
  </div>

</nav>

<script>
(function(){
  var imgs   = document.querySelectorAll('.hero__img');
  var btns   = document.querySelectorAll('.proj-btn');
  var label  = document.getElementById('imgLabel');
  var cur    = 0;

  function switchTo(idx) {
    if (idx === cur) return;
    imgs[cur].classList.remove('is-active');
    btns[cur].classList.remove('is-active');
    cur = idx;
    imgs[cur].classList.add('is-active');
    btns[cur].classList.add('is-active');
    label.textContent = btns[cur].dataset.label;
  }

  btns.forEach(function(btn) {
    btn.addEventListener('click', function() {
      switchTo(parseInt(this.dataset.idx));
    });
  });
})();
</script>

</body>
</html>
