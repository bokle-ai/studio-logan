<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Studio Logan — Architecture &amp; Interiors</title>
<meta name="description" content="Studio Logan — Architecture &amp; Interiors. Crafting spaces where heritage converges with vision.">
<link rel="icon" href="assets/img/lion-double.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tenor+Sans&family=Poppins:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:    #f7f5f2;
  --ink:   #1a1712;
  --mid:   #8a7f72;
  --gold:  #b09a7a;
  --f-display: "Tenor Sans", sans-serif;
  --f-sans:    "Poppins", system-ui, sans-serif;
}

html, body {
  height: 100%;
  overflow: hidden;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--f-sans);
  -webkit-font-smoothing: antialiased;
}

/* ── TOP LOGO ── */
.site-logo {
  position: fixed;
  top: 1.8rem;
  left: 50%;
  transform: translateX(-50%);
  z-index: 50;
  display: flex;
  align-items: center;
  gap: .7rem;
  text-decoration: none;
  color: var(--ink);
  white-space: nowrap;
}
.site-logo__mark {
  width: 58px;
  height: 58px;
  object-fit: contain;
}
.site-logo__name {
  font-family: var(--f-display);
  font-size: 1.4rem;
  letter-spacing: .14em;
  text-transform: uppercase;
}

/* ── HERO SPLIT ── */
.hero {
  display: grid;
  grid-template-columns: 1fr 1fr;
  height: calc(100vh - 72px);
  padding-top: 6rem; /* space for the larger centered logo */
}

/* LEFT PANEL */
.hero__left {
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 2.5rem 3rem 2rem;
  background: var(--bg);
  position: relative;
}

.hero__eyebrow {
  font-family: var(--f-sans);
  font-size: .7rem;
  font-weight: 500;
  letter-spacing: .18em;
  text-transform: uppercase;
  color: var(--gold);
  margin-bottom: 1.2rem;
}

.hero__title {
  font-family: var(--f-display);
  font-size: clamp(3.5rem, 6vw, 6rem);
  line-height: 1;
  letter-spacing: -.01em;
  color: var(--ink);
  margin-bottom: 1.4rem;
}

.hero__desc {
  font-size: .9rem;
  font-weight: 300;
  line-height: 1.75;
  color: var(--mid);
  max-width: 30ch;
  margin-bottom: 2.5rem;
}

.hero__cta {
  display: inline-flex;
  align-items: center;
  gap: .6rem;
  font-size: .78rem;
  font-weight: 500;
  letter-spacing: .12em;
  text-transform: uppercase;
  text-decoration: none;
  color: var(--ink);
  border-bottom: 1px solid var(--ink);
  padding-bottom: .2rem;
  transition: color .3s, border-color .3s;
}
.hero__cta:hover { color: var(--gold); border-color: var(--gold); }

/* RIGHT PANEL */
.hero__right {
  background: var(--bg);
  padding: 0 1.5rem .8rem;
  display: flex;
  align-items: stretch;
}
.hero__img-box {
  position: relative;
  flex: 1;
  overflow: hidden;
  background: #111;
}

.hero__img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  opacity: 0;
  transition: opacity .9s ease;
}
.hero__img.is-active { opacity: 1; }

.hero__img-label {
  position: absolute;
  bottom: 1.8rem;
  left: 2rem;
  font-family: var(--f-sans);
  font-size: .7rem;
  font-weight: 400;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: rgba(255,255,255,.75);
  z-index: 5;
  pointer-events: none;
  transition: opacity .4s;
}

/* ── FOOTER ── */
.site-footer { padding: 2rem 2.5rem; display: flex; align-items: center; justify-content: space-between; gap: 2rem; border-top: 1px solid rgba(176,154,122,.15); flex-wrap: wrap; background: var(--bg); flex-shrink: 0; }
.site-footer__left { display: flex; flex-direction: column; gap: .5rem; }
.site-footer__brand { display: flex; align-items: center; gap: .55rem; text-decoration: none; color: var(--ink); }
.site-footer__mark { width: 20px; height: 20px; object-fit: contain; opacity: .45; }
.site-footer__name { font-family: var(--f-display); font-size: .7rem; letter-spacing: .1em; text-transform: uppercase; color: var(--mid); }
.site-footer__copy { font-size: .55rem; color: var(--mid); padding-left: .1rem; }
.site-footer__right { display: flex; flex-direction: column; align-items: flex-end; gap: .8rem; }
.site-footer__email { font-size: .6rem; letter-spacing: .06em; text-decoration: none; color: var(--mid); transition: color .2s; }
.site-footer__email:hover { color: var(--gold); }
.site-footer__socials { display: flex; gap: .7rem; }
.site-footer__social { display: flex; align-items: center; justify-content: center; width: 32px; height: 32px; border: 1px solid rgba(176,154,122,.3); color: var(--mid); text-decoration: none; transition: color .25s, border-color .25s; }
.site-footer__social:hover { color: var(--gold); border-color: var(--gold); }
.site-footer__social svg { width: 14px; height: 14px; fill: currentColor; }

/* ── MOBILE ── */
@media (max-width: 768px) {
  html, body { overflow: auto; }

  .hero {
    grid-template-columns: 1fr;
    grid-template-rows: 50vh auto;
    height: auto;
  }

  .hero__right { order: -1; height: 50vh; }

  .hero__left {
    padding: 2rem 1.5rem;
    justify-content: flex-start;
  }

  .hero__title { font-size: 2.8rem; }

  .site-footer { padding: 1.8rem 1.5rem; flex-direction: column; align-items: flex-start; gap: 1.4rem; }
  .site-footer__right { align-items: flex-start; }
}
</style>
</head>
<body>

<!-- Logo -->
<a href="index.html" class="site-logo">
  <img src="assets/img/lion-double.png" alt="Studio Logan" class="site-logo__mark">
  <span class="site-logo__name">Studio Logan</span>
</a>

<!-- Hero -->
<main class="hero">

  <!-- Left: text -->
  <div class="hero__left">
<h1 class="hero__title">We create spaces that tell stories</h1>
    <a href="contact.html" class="hero__cta">Start a project &nbsp;→</a>
  </div>

  <!-- Right: images -->
  <div class="hero__right">
    <div class="hero__img-box">
      <img class="hero__img is-active" src="assets/img/canter-hero.jpg"         alt="Canter Hotel">
      <img class="hero__img"           src="assets/img/hardrock-ext.jpg"         alt="Hard Rock Athens">
      <img class="hero__img"           src="assets/img/manhattan-living.jpg"     alt="432 Park Avenue">
      <img class="hero__img"           src="assets/img/piertop-exterior.jpg"     alt="Pier Top">
      <span class="hero__img-label" id="imgLabel">Canter Hotel &nbsp;·&nbsp; Oklahoma City</span>
    </div>
  </div>

</main>

      <span class="site-footer__name">Studio Logan</span>
    </a>
    <span class="site-footer__copy">© <span id="yr"></span> Studio Logan. All rights reserved.</span>
  </div>
  <div class="site-footer__right">
    <a href="mailto:loganathanyeswanth@gmail.com" class="site-footer__email">loganathanyeswanth@gmail.com</a>

    </div>
  </div>
</footer>


<script>
(function(){
  var imgs = document.querySelectorAll('.hero__img');
  var label = document.getElementById('imgLabel');
  var labels = [
    'Canter Hotel · Oklahoma City',
    'Hard Rock Athens · Greece',
    '432 Park Avenue · Manhattan',
    'Pier Top · Fort Lauderdale'
  ];
  var cur = 0;
  setInterval(function(){
    imgs[cur].classList.remove('is-active');
    cur = (cur + 1) % imgs.length;
    imgs[cur].classList.add('is-active');
    if(label) label.textContent = labels[cur];
  }, 4500);
})();
document.getElementById('yr').textContent = new Date().getFullYear();
</script>
</body>
</html>
