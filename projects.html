<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Projects — Studio Logan Architecture &amp; Interiors</title>
<meta name="description" content="Studio Logan portfolio — hospitality and residential environments across three continents.">
<link rel="icon" href="assets/img/lion-double.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tenor+Sans&family=Poppins:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg:   #f7f5f2;
  --ink:  #1a1712;
  --mid:  #8a7f72;
  --gold: #b09a7a;
  --f-display: "Tenor Sans", sans-serif;
  --f-sans:    "Poppins", system-ui, sans-serif;
}
html, body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--f-sans);
  -webkit-font-smoothing: antialiased;
}

/* ── TOP NAV ── */
.top-nav {
  position: fixed;
  top: 0; left: 0; right: 0;
  height: 68px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 2.5rem;
  background: var(--bg);
  border-bottom: 1px solid rgba(176,154,122,.2);
  z-index: 100;
}
.top-nav__brand {
  display: flex;
  align-items: center;
  gap: .6rem;
  text-decoration: none;
  color: var(--ink);
}
.top-nav__mark { width: 28px; height: 28px; object-fit: contain; }
.top-nav__name {
  font-family: var(--f-display);
  font-size: .82rem;
  letter-spacing: .12em;
  text-transform: uppercase;
}
.top-nav__links {
  display: flex;
  align-items: center;
  gap: 2.4rem;
}
.top-nav__links a {
  font-size: .68rem;
  font-weight: 400;
  letter-spacing: .16em;
  text-transform: uppercase;
  text-decoration: none;
  color: var(--mid);
  transition: color .25s;
}
.top-nav__links a:hover { color: var(--ink); }
.top-nav__links a.nav-active { color: var(--ink); font-weight: 500; }
.top-nav__links a.nav-contact {
  border: 1px solid var(--gold);
  color: var(--ink);
  padding: .45rem 1.3rem;
}
.top-nav__links a.nav-contact:hover { color: var(--gold); }

/* ── PAGE LAYOUT ── */
.projects-page {
  margin-top: 68px;
  display: flex;
  flex-direction: column;
  padding: 2rem 2.5rem 1.5rem;
  gap: 1.5rem;
}

/* ── HEADER ── */
.projects-header {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  gap: .8rem;
  flex-shrink: 0;
  padding-bottom: .5rem;
}
.projects-label {
  font-family: var(--f-sans);
  font-size: .6rem;
  font-weight: 400;
  letter-spacing: .18em;
  text-transform: uppercase;
  color: var(--mid);
}
.projects-title {
  font-family: var(--f-display);
  font-size: clamp(2.8rem, 4.5vw, 4rem);
  line-height: 1.05;
  color: var(--ink);
  letter-spacing: -.01em;
  text-align: center;
}
.projects-quote {
  font-family: var(--f-display);
  font-size: clamp(1.4rem, 2.2vw, 2rem);
  line-height: 1.4;
  color: var(--ink);
  max-width: 56ch;
  text-align: center;
}
.projects-quote strong {
  font-weight: 600;
  color: var(--gold);
}

/* ── 3-COL GRID ── */
.projects-grid {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 1.4rem;
  align-content: start;
}

.project-item {
  display: flex;
  flex-direction: column;
  gap: .7rem;
}

.project-card {
  position: relative;
  overflow: hidden;
  display: block;
  text-decoration: none;
  background: #111;
  aspect-ratio: 16 / 9;
  width: 100%;
}
.project-card__img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  opacity: .9;
  transition: opacity .6s ease, transform .7s ease;
}
.project-card:hover .project-card__img {
  opacity: 1;
  transform: scale(1.04);
}

.project-card__meta {
  flex-shrink: 0;
  padding: 0 .1rem;
}
.project-card__name {
  font-family: var(--f-display);
  font-size: clamp(.9rem, 1.4vw, 1.2rem);
  line-height: 1.2;
  color: var(--ink);
  margin-bottom: .2rem;
}
.project-card__place {
  font-family: var(--f-sans);
  font-size: .62rem;
  font-weight: 400;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--mid);
}

/* ── CTA ── */
.cta-strip { display: flex; align-items: center; justify-content: space-between; padding: 2.5rem 2.5rem; border-top: 1px solid rgba(176,154,122,.2); }
.cta-strip__text { font-family: var(--f-display); font-size: clamp(1.1rem, 2vw, 1.6rem); color: var(--ink); }
.cta-strip__btn { font-size: .68rem; font-weight: 500; letter-spacing: .2em; text-transform: uppercase; text-decoration: none; color: var(--ink); border: 1px solid var(--gold); padding: .7rem 2rem; transition: background .25s, color .25s; white-space: nowrap; }
.cta-strip__btn:hover { background: var(--gold); color: var(--bg); }
/* ── FOOTER ── */
.site-footer { margin: 0 -2.5rem; padding: 2rem 2.5rem; display: flex; align-items: center; justify-content: space-between; gap: 2rem; border-top: 1px solid rgba(176,154,122,.28); flex-wrap: wrap; background: var(--bg); }
.site-footer__left { display: flex; flex-direction: column; gap: .5rem; }
.site-footer__brand { display: flex; align-items: center; gap: .55rem; text-decoration: none; color: var(--ink); }
.site-footer__mark { width: 20px; height: 20px; object-fit: contain; opacity: .45; }
.site-footer__name { font-family: var(--f-display); font-size: .7rem; letter-spacing: .1em; text-transform: uppercase; color: var(--mid); }
.site-footer__copy { font-size: .55rem; color: var(--mid); padding-left: .1rem; }
.site-footer__right { display: flex; flex-direction: column; align-items: flex-end; gap: .8rem; }
.site-footer__email { font-size: .6rem; letter-spacing: .06em; text-decoration: none; color: var(--mid); transition: color .2s; }
.site-footer__email:hover { color: var(--gold); }
.site-footer__socials { display: flex; gap: .7rem; }
.site-footer__social { display: flex; align-items: center; justify-content: center; width: 32px; height: 32px; border: 1px solid rgba(176,154,122,.3); color: var(--mid); text-decoration: none; transition: color .25s, border-color .25s; }
.site-footer__social:hover { color: var(--gold); border-color: var(--gold); }
.site-footer__social svg { width: 14px; height: 14px; fill: currentColor; }

/* ── MOBILE ── */
@media (max-width: 768px) {
  .projects-page { padding: 1.5rem; gap: 1.2rem; }
  .projects-grid { grid-template-columns: 1fr; gap: 1.4rem; }
  .project-card { aspect-ratio: 16 / 9; height: auto; }
  .project-card__name { font-size: .82rem; }
  .project-card__place { font-size: .6rem; }
  .projects-header { text-align: center; align-items: center; gap: .7rem; }
  .cta-strip { flex-direction: column; align-items: flex-start; gap: 1.2rem; padding: 2rem 1.5rem; }
  .site-footer { margin: 0 -1.5rem; padding: 1.8rem 1.5rem; flex-direction: column; align-items: flex-start; gap: 1.4rem; }
  .site-footer__right { align-items: flex-start; }
  .top-nav__links { gap: 1.2rem; }
  .top-nav__links a { font-size: .6rem; }
}

/* ── MOBILE NAV HAMBURGER ── */
.nav-hamburger { display: none; }
@media (max-width: 768px) {
  .nav-hamburger {
    display: flex; flex-direction: column; justify-content: center; gap: 5px;
    cursor: pointer; padding: 4px; background: none; border: none; flex-shrink: 0;
  }
  .nav-hamburger span { display: block; width: 22px; height: 2px; background: var(--ink); transition: transform .25s, opacity .25s; }
  .nav-hamburger.is-open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
  .nav-hamburger.is-open span:nth-child(2) { opacity: 0; }
  .nav-hamburger.is-open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }
  .top-nav__links {
    display: none; position: fixed; top: 68px; left: 0; right: 0;
    background: var(--bg); flex-direction: column; padding: 1.8rem 2.5rem;
    gap: 1.4rem; border-bottom: 1px solid rgba(176,154,122,.2); z-index: 99;
  }
  .top-nav__links.is-open { display: flex; }
  .top-nav__links a { font-size: .78rem; }
}
</style>
</head>

<script>
document.getElementById('yr').textContent = new Date().getFullYear();
(function(){
  fetch('content.json?v=' + Date.now())
    .then(function(r){ return r.json(); })
    .then(function(data){
      var grid = document.getElementById('projects-grid');
      var projects = data.projects || [];
      if (!projects.length) return;
      grid.innerHTML = projects.map(function(p){
        return '<div class="project-item"><a class="project-card" href="' + p.url + '"><img class="project-card__img" src="' + p.coverImage + '" alt="' + p.displayName + '"></a><div class="project-card__meta"><p class="project-card__name">' + p.displayName + '</p><p class="project-card__place">' + p.location + '</p></div></div>';
      }).join('');
    })
    .catch(function(){
      /* fallback: show placeholder if content.json unavailable */
      document.getElementById('projects-grid').innerHTML = '<p style="color:var(--mid);padding:2rem">Unable to load projects.</p>';
    });
})();
</script>
<script>
(function(){
  var btn = document.getElementById('navHamburger');
  var links = document.querySelector('.top-nav__links');
  if(!btn || !links) return;
  btn.addEventListener('click', function(){
    btn.classList.toggle('is-open');
    links.classList.toggle('is-open');
  });
  document.addEventListener('click', function(e){
    if(!e.target.closest('.top-nav')) {
      btn.classList.remove('is-open');
      links.classList.remove('is-open');
    }
  });
})();
</script>
</body>
