<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact — Studio Logan</title>
<meta name="description" content="Start a project with Studio Logan. Tell us about the space you're building.">
<link rel="icon" href="assets/img/lion-double.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tenor+Sans&family=Poppins:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg:   #f7f5f2;
  --ink:  #1a1712;
  --mid:  #8a7f72;
  --gold: #b09a7a;
  --f-display: "Tenor Sans", sans-serif;
  --f-sans:    "Poppins", system-ui, sans-serif;
}
html, body { background: var(--bg); color: var(--ink); font-family: var(--f-sans); -webkit-font-smoothing: antialiased; }

/* TOP NAV */
.top-nav { position: fixed; top: 0; left: 0; right: 0; height: 68px; display: flex; align-items: center; justify-content: space-between; padding: 0 2.5rem; background: var(--bg); border-bottom: 1px solid rgba(176,154,122,.2); z-index: 100; }
.top-nav__brand { display: flex; align-items: center; gap: .6rem; text-decoration: none; color: var(--ink); }
.top-nav__mark { width: 28px; height: 28px; object-fit: contain; }
.top-nav__name { font-family: var(--f-display); font-size: .82rem; letter-spacing: .12em; text-transform: uppercase; }
.top-nav__links { display: flex; align-items: center; gap: 2.4rem; }
.top-nav__links a { font-size: .68rem; font-weight: 400; letter-spacing: .16em; text-transform: uppercase; text-decoration: none; color: var(--mid); transition: color .25s; }
.top-nav__links a:hover { color: var(--ink); }
.top-nav__links a.nav-active { color: var(--ink); font-weight: 500; border: 1px solid var(--gold); padding: .45rem 1.3rem; }
.top-nav__links a.nav-active:hover { color: var(--gold); }

/* CONTACT GRID */
.contact-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  height: auto;
  min-height: 0;
  max-height: calc(100vh - 68px);
  margin-top: 68px;
}

/* LEFT */
.contact-left {
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 3.5rem 3.5rem;
  border-right: 1px solid rgba(176,154,122,.15);
  overflow-y: auto;
}
.contact-label {
  font-size: .6rem;
  font-weight: 400;
  letter-spacing: .18em;
  text-transform: uppercase;
  color: var(--mid);
  display: inline-block;
  margin-bottom: 1.2rem;
}
.contact-heading {
  font-family: var(--f-display);
  font-size: clamp(2rem, 4vw, 3.6rem);
  line-height: 1.1;
  color: var(--ink);
  margin-bottom: .6rem;
}
.contact-sub {
  font-size: .82rem;
  font-weight: 300;
  line-height: 1.8;
  color: var(--mid);
  max-width: 38ch;
  margin-bottom: 2.5rem;
}

/* FORM */
.contact-form { display: flex; flex-direction: column; gap: 1rem; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
.form-field {
  display: flex;
  flex-direction: column;
  gap: .35rem;
}
.form-field label {
  font-size: .55rem;
  font-weight: 600;
  letter-spacing: .2em;
  text-transform: uppercase;
  color: var(--gold);
}
.form-field input,
.form-field textarea {
  background: transparent;
  border: none;
  border-bottom: 1px solid rgba(176,154,122,.4);
  padding: .6rem 0;
  font-family: var(--f-sans);
  font-size: .82rem;
  font-weight: 300;
  color: var(--ink);
  outline: none;
  transition: border-color .25s;
  width: 100%;
}
.form-field input:focus,
.form-field textarea:focus { border-bottom-color: var(--gold); }
.form-field textarea { resize: none; height: 80px; }
.form-field input::placeholder,
.form-field textarea::placeholder { color: var(--mid); opacity: .6; }

.contact-submit {
  margin-top: .5rem;
  font-family: var(--f-sans);
  font-size: .68rem;
  font-weight: 500;
  letter-spacing: .18em;
  text-transform: uppercase;
  color: var(--ink);
  background: transparent;
  border: 1px solid var(--gold);
  padding: .85rem 2.5rem;
  cursor: pointer;
  transition: background .25s, color .25s;
  align-self: flex-start;
}
.contact-submit:hover { background: var(--gold); color: var(--bg); }

/* INFO BLOCK */
.contact-info {
  margin-top: 3rem;
  padding-top: 2.5rem;
  border-top: 1px solid rgba(176,154,122,.2);
  display: flex;
  gap: 4rem;
}
.contact-info__item { display: flex; flex-direction: column; gap: .6rem; }
.contact-info__label {
  font-size: .55rem;
  font-weight: 600;
  letter-spacing: .2em;
  text-transform: uppercase;
  color: var(--gold);
}
.contact-info__val {
  font-family: var(--f-display);
  font-size: 1rem;
  color: var(--ink);
  white-space: nowrap;
}

/* SOCIAL */
.contact-social { margin-top: 2.5rem; }
.contact-social__label {
  font-size: .55rem;
  font-weight: 600;
  letter-spacing: .2em;
  text-transform: uppercase;
  color: var(--gold);
  margin-bottom: 1rem;
}
.contact-social__links { display: flex; gap: 1rem; }
.contact-social__link {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 42px;
  height: 42px;
  border: 1px solid rgba(176,154,122,.35);
  color: var(--mid);
  text-decoration: none;
  transition: color .25s, border-color .25s, background .25s;
}
.contact-social__link:hover { color: var(--gold); border-color: var(--gold); background: rgba(176,154,122,.06); }
.contact-social__link svg { width: 18px; height: 18px; fill: currentColor; }

/* RIGHT — horse image */
.contact-right {
  position: relative;
  overflow: hidden;
  background: #111;
  min-height: 60vh;
}
.contact-right img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center top;
  display: block;
}

/* FOOTER */
/* ── FOOTER ── */
.site-footer { padding: 2rem 2.5rem; display: flex; align-items: center; justify-content: space-between; gap: 2rem; border-top: 1px solid rgba(176,154,122,.15); flex-wrap: wrap; background: var(--bg); flex-shrink: 0; }
.site-footer__left { display: flex; flex-direction: column; gap: .5rem; }
.site-footer__brand { display: flex; align-items: center; gap: .55rem; text-decoration: none; color: var(--ink); }
.site-footer__mark { width: 20px; height: 20px; object-fit: contain; opacity: .45; }
.site-footer__name { font-family: var(--f-display); font-size: .7rem; letter-spacing: .1em; text-transform: uppercase; color: var(--mid); }
.site-footer__copy { font-size: .55rem; color: var(--mid); padding-left: .1rem; }
.site-footer__right { display: flex; flex-direction: column; align-items: flex-end; gap: .8rem; }
.site-footer__email { font-size: .6rem; letter-spacing: .06em; text-decoration: none; color: var(--mid); transition: color .2s; }
.site-footer__email:hover { color: var(--gold); }
.site-footer__socials { display: flex; gap: .7rem; }
.site-footer__social { display: flex; align-items: center; justify-content: center; width: 32px; height: 32px; border: 1px solid rgba(176,154,122,.3); color: var(--mid); text-decoration: none; transition: color .25s, border-color .25s; }
.site-footer__social:hover { color: var(--gold); border-color: var(--gold); }
.site-footer__social svg { width: 14px; height: 14px; fill: currentColor; }

/* MOBILE */
@media (max-width: 768px) {
  .contact-grid { grid-template-columns: 1fr; }
  .contact-right { height: 60vw; min-height: unset; }
  .contact-left { padding: 5.5rem 1.5rem 2.5rem; }
  .form-row { grid-template-columns: 1fr; }
  .contact-info { gap: 2rem; flex-wrap: wrap; }
  .top-nav__links { gap: 1.2rem; }
  .top-nav__links a { font-size: .58rem; letter-spacing: .1em; }
  .top-nav__links a.nav-active { padding: .35rem .9rem; }
  .site-footer { padding: 1.8rem 1.5rem; flex-direction: column; align-items: flex-start; gap: 1.4rem; }
  .site-footer__right { align-items: flex-start; }
}
</style>
</head>
