<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact — Studio Logan</title>
<meta name="description" content="Start a project with Studio Logan. Tell us about the space you're building.">
<link rel="icon" href="assets/img/lion-double.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tenor+Sans&family=Poppins:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg:   #f7f5f2;
  --ink:  #1a1712;
  --mid:  #8a7f72;
  --gold: #b09a7a;
  --f-display: "Tenor Sans", sans-serif;
  --f-sans:    "Poppins", system-ui, sans-serif;
}
html, body { background: var(--bg); color: var(--ink); font-family: var(--f-sans); -webkit-font-smoothing: antialiased; }

/* TOP NAV */
.top-nav { position: fixed; top: 0; left: 0; right: 0; height: 68px; display: flex; align-items: center; justify-content: space-between; padding: 0 2.5rem; background: var(--bg); border-bottom: 1px solid rgba(176,154,122,.2); z-index: 100; }
.top-nav__brand { display: flex; align-items: center; gap: .6rem; text-decoration: none; color: var(--ink); }
.top-nav__mark { width: 28px; height: 28px; object-fit: contain; }
.top-nav__name { font-family: var(--f-display); font-size: .82rem; letter-spacing: .12em; text-transform: uppercase; }
.top-nav__links { display: flex; align-items: center; gap: 2.4rem; }
.top-nav__links a { font-size: .68rem; font-weight: 400; letter-spacing: .16em; text-transform: uppercase; text-decoration: none; color: var(--mid); transition: color .25s; }
.top-nav__links a:hover { color: var(--ink); }
.top-nav__links a.nav-active { color: var(--ink); font-weight: 500; border: 1px solid var(--gold); padding: .45rem 1.3rem; }
.top-nav__links a.nav-active:hover { color: var(--gold); }

/* CONTACT GRID */
.contact-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  min-height: calc(100vh - 68px);
  margin-top: 68px;
}

/* LEFT */
.contact-left {
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 3.5rem 3.5rem;
  border-right: 1px solid rgba(176,154,122,.15);
  overflow-y: auto;
}
.contact-label {
  font-size: .62rem;
  font-weight: 500;
  letter-spacing: .22em;
  text-transform: uppercase;
  color: var(--gold);
  border-bottom: 1px solid var(--gold);
  padding-bottom: .25rem;
  display: inline-block;
  margin-bottom: 1.2rem;
}
.contact-heading {
  font-family: var(--f-display);
  font-size: clamp(2rem, 4vw, 3.6rem);
  line-height: 1.1;
  color: var(--ink);
  margin-bottom: .6rem;
}
.contact-sub {
  font-size: .82rem;
  font-weight: 300;
  line-height: 1.8;
  color: var(--mid);
  max-width: 38ch;
  margin-bottom: 2.5rem;
}

/* FORM */
.contact-form { display: flex; flex-direction: column; gap: 1rem; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
.form-field {
  display: flex;
  flex-direction: column;
  gap: .35rem;
}
.form-field label {
  font-size: .55rem;
  font-weight: 600;
  letter-spacing: .2em;
  text-transform: uppercase;
  color: var(--gold);
}
.form-field input,
.form-field textarea {
  background: transparent;
  border: none;
  border-bottom: 1px solid rgba(176,154,122,.4);
  padding: .6rem 0;
  font-family: var(--f-sans);
  font-size: .82rem;
  font-weight: 300;
  color: var(--ink);
  outline: none;
  transition: border-color .25s;
  width: 100%;
}
.form-field input:focus,
.form-field textarea:focus { border-bottom-color: var(--gold); }
.form-field textarea { resize: none; height: 80px; }
.form-field input::placeholder,
.form-field textarea::placeholder { color: var(--mid); opacity: .6; }

.contact-submit {
  margin-top: .5rem;
  font-family: var(--f-sans);
  font-size: .68rem;
  font-weight: 500;
  letter-spacing: .18em;
  text-transform: uppercase;
  color: var(--ink);
  background: transparent;
  border: 1px solid var(--gold);
  padding: .85rem 2.5rem;
  cursor: pointer;
  transition: background .25s, color .25s;
  align-self: flex-start;
}
.contact-submit:hover { background: var(--gold); color: var(--bg); }

/* INFO BLOCK */
.contact-info {
  margin-top: 2.5rem;
  padding-top: 2rem;
  border-top: 1px solid rgba(176,154,122,.2);
  display: flex;
  gap: 3rem;
}
.contact-info__item { }
.contact-info__label {
  font-size: .55rem;
  font-weight: 600;
  letter-spacing: .2em;
  text-transform: uppercase;
  color: var(--gold);
  margin-bottom: .4rem;
}
.contact-info__val {
  font-family: var(--f-display);
  font-size: .9rem;
  color: var(--ink);
}

/* RIGHT — horse image */
.contact-right {
  position: relative;
  overflow: hidden;
  background: #111;
  min-height: 60vh;
}
.contact-right img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center top;
  display: block;
}

/* FOOTER */
.site-footer { padding: 2rem 2.5rem; display: flex; align-items: center; justify-content: space-between; gap: 2rem; border-top: 1px solid rgba(176,154,122,.15); flex-wrap: wrap; }
.site-footer__brand { display: flex; align-items: center; gap: .6rem; text-decoration: none; color: var(--ink); }
.site-footer__mark { width: 22px; height: 22px; object-fit: contain; opacity: .5; }
.site-footer__name { font-family: var(--f-display); font-size: .72rem; letter-spacing: .1em; text-transform: uppercase; color: var(--mid); }
.site-footer__links { display: flex; gap: 2rem; flex-wrap: wrap; }
.site-footer__links a { font-size: .6rem; letter-spacing: .14em; text-transform: uppercase; text-decoration: none; color: var(--mid); transition: color .2s; }
.site-footer__links a:hover { color: var(--ink); }
.site-footer__copy { font-size: .58rem; color: var(--mid); }

/* MOBILE */
@media (max-width: 768px) {
  .contact-grid { grid-template-columns: 1fr; }
  .contact-right { height: 60vw; min-height: unset; }
  .contact-left { padding: 5.5rem 1.5rem 2.5rem; }
  .form-row { grid-template-columns: 1fr; }
  .contact-info { gap: 2rem; flex-wrap: wrap; }
  .top-nav__links { gap: 1.2rem; }
  .top-nav__links a { font-size: .58rem; letter-spacing: .1em; }
  .top-nav__links a.nav-active { padding: .35rem .9rem; }
  .site-footer { flex-direction: column; align-items: flex-start; gap: 1.2rem; }
  .site-footer__links { gap: 1.2rem; }
}
</style>
</head>
<body>

<nav class="top-nav">
  <a href="index.html" class="top-nav__brand">
    <img src="assets/img/lion-double.png" alt="Studio Logan" class="top-nav__mark">
    <span class="top-nav__name">Studio Logan</span>
  </a>
  <div class="top-nav__links">
    <a href="studio.html">Studio</a>
    <a href="projects.html">Projects</a>
    <a href="awards.html">Awards</a>
    <a href="services.html">Our Services</a>
    <a href="contact.html" class="nav-active">Contact</a>
  </div>
</nav>

<div class="contact-grid">

  <!-- LEFT: Form -->
  <div class="contact-left">
    <span class="contact-label">Contact</span>
    <h1 class="contact-heading">Let's<br>Collaborate</h1>
    <p class="contact-sub">Tell us about the space you're building. We respond within 24 hours.</p>

    <form class="contact-form" action="#" method="POST">
      <div class="form-row">
        <div class="form-field">
          <label for="name">Your Name</label>
          <input type="text" id="name" name="name" placeholder="Full name">
        </div>
        <div class="form-field">
          <label for="phone">Phone</label>
          <input type="tel" id="phone" name="phone" placeholder="+1 000 000 0000">
        </div>
      </div>
      <div class="form-field">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" placeholder="your@email.com">
      </div>
      <div class="form-field">
        <label for="project">Tell Us About Your Project</label>
        <textarea id="project" name="project" placeholder="Project type, location, scale, timeline…"></textarea>
      </div>
      <button type="submit" class="contact-submit">Send Enquiry &nbsp;→</button>
    </form>

    <div class="contact-info">
      <div class="contact-info__item">
        <p class="contact-info__label">Email</p>
        <p class="contact-info__val">loganathanyeswanth@gmail.com</p>
      </div>
      <div class="contact-info__item">
        <p class="contact-info__label">Phone</p>
        <p class="contact-info__val">+91 73050 82466</p>
      </div>
    </div>
  </div>

  <!-- RIGHT: Horse image -->
  <div class="contact-right">
    <img src="assets/img/expertise-horse.jpg" alt="Studio Logan">
  </div>

</div>

<footer class="site-footer">
  <a href="index.html" class="site-footer__brand">
    <img src="assets/img/lion-double.png" alt="" class="site-footer__mark">
    <span class="site-footer__name">Studio Logan</span>
  </a>
  <nav class="site-footer__links">
    <a href="studio.html">Studio</a>
    <a href="projects.html">Projects</a>
    <a href="awards.html">Awards</a>
    <a href="services.html">Services</a>
    <a href="contact.html">Contact</a>
  </nav>
  <span class="site-footer__copy">© <span id="yr"></span> Studio Logan</span>
</footer>

<script>document.getElementById('yr').textContent = new Date().getFullYear();</script>
</body>
</html>
